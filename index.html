<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neynar Score Checker - Farcaster Mini App</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Lucide icons as components
    const Search = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    );
    
    const User = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    
    const TrendingUp = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    );
    
    const Calendar = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
    );
    
    const AlertCircle = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );

    function NeynarScoreChecker() {
      const [username, setUsername] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [userData, setUserData] = useState(null);
      const [sdkLoaded, setSdkLoaded] = useState(false);

      useEffect(() => {
        const loadSDK = async () => {
          try {
            const { sdk } = await import('https://esm.sh/@farcaster/miniapp-sdk');
            await sdk.actions.ready();
            setSdkLoaded(true);
          } catch (err) {
            console.log('Not running in Farcaster Mini App environment');
            setSdkLoaded(true);
          }
        };
        loadSDK();
      }, []);

      const checkScore = async () => {
        if (!username.trim()) {
          setError('Please enter a username');
          return;
        }

        setLoading(true);
        setError('');
        setUserData(null);

        try {
          const cleanUsername = username.replace(/^@/, '');
          const apiKey = (() => { let k=''; try { k = import.meta.env?.VITE_NEYNAR_API_KEY ?? ''; } catch(_) {} return k || window.NEYNAR_API_KEY || localStorage.getItem('NEYNAR_API_KEY') || 'ED2189A3-1259-4873-9ED3-67F9B53BDBE7'; })();
          const headers = { 'accept': 'application/json', 'api_key': apiKey, 'X-API-KEY': apiKey, 'api-key': apiKey };

          let found = false;
          let resp = await fetch(`https://api.neynar.com/v2/farcaster/user/by-username?username=${encodeURIComponent(cleanUsername)}`, { headers });
          if (resp.ok) {
            const d = await resp.json();
            const u = d.user || d;
            if (u) {
              setUserData(u);
              found = true;
            }
          }

          if (!found) {
            resp = await fetch(`https://api.neynar.com/v2/farcaster/user?username=${encodeURIComponent(cleanUsername)}`, { headers });
            if (resp.ok) {
              const d = await resp.json();
              const u = d.user || d;
              if (u) {
                setUserData(u);
                found = true;
              }
            }
          }

          if (!found) {
            throw new Error('User not found or API error');
          }
        } catch (err) {
          setError(err.message || 'Failed to fetch user data');
        } finally {
          setLoading(false);
        }
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') {
          checkScore();
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-900 via-purple-800 to-indigo-900 p-6">
          {!sdkLoaded && (
            <div className="fixed inset-0 bg-purple-900 flex items-center justify-center">
              <div className="text-white text-center">
                <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-4" />
                <p>Loading...</p>
              </div>
            </div>
          )}
          <div className="max-w-2xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-4xl font-bold text-white mb-2">
                Neynar Score Checker
              </h1>
              <p className="text-purple-200">Check any Farcaster user's score and stats</p>
            </div>

            <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl mb-6">
              <div className="flex gap-3">
                <div className="flex-1 relative">
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    onKeyPress={handleKeyPress}
                    placeholder="Enter Farcaster username..."
                    className="w-full px-4 py-3 pl-10 bg-white/20 border border-white/30 rounded-xl text-white placeholder-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-400"
                  />
                  <div className="absolute left-3 top-3.5">
                    <User />
                  </div>
                </div>
                <button
                  onClick={checkScore}
                  disabled={loading}
                  className="px-6 py-3 bg-purple-500 hover:bg-purple-600 disabled:bg-purple-700 disabled:cursor-not-allowed text-white rounded-xl font-semibold transition-colors flex items-center gap-2"
                >
                  {loading ? (
                    <>
                      <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                      Checking...
                    </>
                  ) : (
                    <>
                      <Search />
                      Check Score
                    </>
                  )}
                </button>
              </div>

              {error && (
                <div className="mt-4 p-3 bg-red-500/20 border border-red-400/50 rounded-lg flex items-center gap-2 text-red-200">
                  <AlertCircle />
                  <span>{error}</span>
                </div>
              )}
            </div>

            {userData && (
              <div className="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center gap-4 mb-6 pb-6 border-b border-white/20">
                  <img
                    src={userData.pfp_url || 'https://via.placeholder.com/80'}
                    alt={userData.display_name}
                    className="w-20 h-20 rounded-full border-4 border-purple-400"
                  />
                  <div className="flex-1">
                    <h2 className="text-2xl font-bold text-white">
                      {userData.display_name}
                    </h2>
                    <p className="text-purple-200">@{userData.username}</p>
                    {userData.power_badge && (
                      <span className="inline-block mt-1 px-2 py-0.5 bg-yellow-500/20 border border-yellow-400/50 rounded text-yellow-300 text-xs font-semibold">
                        ⚡ Power Badge
                      </span>
                    )}
                  </div>
                </div>

                {userData.profile?.bio?.text && (
                  <div className="mb-6">
                    <p className="text-purple-100">{userData.profile.bio.text}</p>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white/10 rounded-xl p-4">
                    <div className="flex items-center gap-2 mb-1">
                      <TrendingUp />
                      <span className="text-purple-200 text-sm">Follower Count</span>
                    </div>
                    <p className="text-3xl font-bold text-white">
                      {userData.follower_count?.toLocaleString() || 0}
                    </p>
                  </div>

                  <div className="bg-white/10 rounded-xl p-4">
                    <div className="flex items-center gap-2 mb-1">
                      <User />
                      <span className="text-purple-200 text-sm">Following Count</span>
                    </div>
                    <p className="text-3xl font-bold text-white">
                      {userData.following_count?.toLocaleString() || 0}
                    </p>
                  </div>

                  <div className="bg-white/10 rounded-xl p-4">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-purple-200 text-sm">FID</span>
                    </div>
                    <p className="text-3xl font-bold text-white">
                      {userData.fid}
                    </p>
                  </div>

                  <div className="bg-white/10 rounded-xl p-4">
                    <div className="flex items-center gap-2 mb-1">
                      <Calendar />
                      <span className="text-purple-200 text-sm">Verified</span>
                    </div>
                    <p className="text-2xl font-bold text-white">
                      {userData.verified_addresses?.eth_addresses?.length > 0 ? '✓' : '✗'}
                    </p>
                  </div>
                </div>

                {userData.verified_addresses?.eth_addresses?.length > 0 && (
                  <div className="mt-6 pt-6 border-t border-white/20">
                    <h3 className="text-sm font-semibold text-purple-200 mb-2">
                      Verified Addresses
                    </h3>
                    <div className="space-y-1">
                      {userData.verified_addresses.eth_addresses.slice(0, 3).map((addr, i) => (
                        <div key={i} className="text-xs text-purple-100 font-mono bg-white/5 px-3 py-2 rounded">
                          {addr}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="mt-6 text-center text-purple-200 text-sm">
              <p>Powered by Neynar API</p>
            </div>

            <div className="mt-6 bg-slate-800/50 backdrop-blur-lg rounded-2xl p-6 shadow-2xl border border-slate-700/50">
              <h3 className="text-white text-xl font-semibold text-center mb-2">
                Support the developer
              </h3>
              <p className="text-slate-300 text-center text-sm mb-4">
                Follow and tip to keep updates coming.
              </p>
              
              <div className="space-y-3">
                <button
                  onClick={() => window.open('https://warpcast.com/web3player', '_blank')}
                  className="w-full px-6 py-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-white rounded-xl font-semibold transition-all"
                >
                  Follow @web3player
                </button>
                
                <button
                  onClick={() => window.open('https://warpcast.com/web3player', '_blank')}
                  className="w-full px-6 py-3 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white rounded-xl font-semibold transition-all flex items-center justify-center gap-2"
                >
                  Tip 💜
                </button>
              </div>
            </div>

            <div className="mt-6 bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
              <h2 className="text-2xl font-bold text-white mb-4">What is Neynar Score?</h2>
              
              <p className="text-slate-300 mb-4 leading-relaxed">
                The Neynar Score is a metric ranging from 0 to 1 that evaluates the quality of user interactions on the Farcaster platform. A higher score indicates a higher confidence in the user being of high quality. This score is updated weekly and reflects the value an account adds to the network.
              </p>

              <ul className="space-y-3 text-slate-300">
                <li className="flex gap-2">
                  <span className="text-purple-400 flex-shrink-0">–</span>
                  <span>The score measures account quality and the positive impact of user activity on the network.</span>
                </li>
                <li className="flex gap-2">
                  <span className="text-purple-400 flex-shrink-0">–</span>
                  <span>It is not a proof of humanity but assesses account quality, distinguishing between high and low-quality activities, including AI-generated content.</span>
                </li>
                <li className="flex gap-2">
                  <span className="text-purple-400 flex-shrink-0">–</span>
                  <span>Users can enhance their scores by engaging in meaningful interactions with other reputable users.</span>
                </li>
              </ul>

              <a
                href="https://neynar-three.vercel.app/"
                target="_blank"
                rel="noopener noreferrer"
                className="inline-block mt-4 text-orange-400 hover:text-orange-300 transition-colors"
              >
                Learn more →
              </a>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<NeynarScoreChecker />, document.getElementById('root'));
  </script>
</body>
</html>
